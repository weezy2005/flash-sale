services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
