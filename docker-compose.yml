services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Each service owns its database; nothing reads another service's tables.
  orders-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft broker; the image's defaults advertise localhost:9092.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
