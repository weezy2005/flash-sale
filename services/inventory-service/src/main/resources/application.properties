spring.application.name=inventory-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventory}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD:flashsale}

management.endpoints.web.exposure.include=health,info

inventory.reservation-ttl=10m

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Idempotent producer: broker-side retries cannot duplicate or reorder a send.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
