spring.application.name=order-service
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/orders}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD:flashsale}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management.endpoints.web.exposure.include=health,info

spring.kafka.consumer.group-id=order-service
# A new consumer group starts from the beginning so no event is skipped.
spring.kafka.consumer.auto-offset-reset=earliest
# The topic belongs to inventory-service, which creates it with the right
# partition count. Without this, an order service that starts first would
# auto-create it with the broker default of one partition.
spring.kafka.consumer.properties.allow.auto.create.topics=false
